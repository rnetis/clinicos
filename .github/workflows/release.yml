name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (for example v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --all-targets

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          name="clinicos-${TAG}-${TARGET}"
          bin="target/${TARGET}/release/clinicos"
          if [ -f "${bin}.exe" ]; then bin="${bin}.exe"; fi
          if [ ! -f "$bin" ]; then echo "binary not found: $bin" >&2; exit 1; fi

          stage="dist/${name}"
          mkdir -p "$stage"
          cp "$bin" "$stage/"
          cp -R web migrations "$stage/"
          cp README.md .env.example "$stage/"
          # Ship the license/notice only when the project adds one.
          [ -f LICENSE ] && cp LICENSE "$stage/" || true

          cd dist
          if [ "$ARCHIVE" = "zip" ]; then
            7z a -tzip "${name}.zip" "$name" >/dev/null
          else
            tar -czf "${name}.tar.gz" "$name"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: clinicos-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve tag
        id: meta
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${TAG:-}" ]; then echo "a release tag is required" >&2; exit 1; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checksums
        run: |
          set -euo pipefail
          cd artifacts
          ls -l
          find . -maxdepth 1 \( -name '*.tar.gz' -o -name '*.zip' \) -print0 \
            | sort -z | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ClinicOS ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/SHA256SUMS
